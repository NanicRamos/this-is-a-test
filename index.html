<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Samurai Arts</title>
</head>
<body>
    <div style="position: relative; display: inline-block;">
        <div style="position: absolute; display: flex; width: 100%; align-items: center; padding: 20px;">
            <!--Player Hp-->
            <div style="position: relative;  width: 100%; height: 30px; display: flex; justify-content: flex-end;">
                <div style="background-color: black; height: 30px; width: 100%"></div>
                <div id="myPlayerHP"></div>
            </div>
            <!--Timer-->
            <div id="myTimer">10</div>
            <!--Ememy Hp-->
            <div style="position: relative;  width: 100%; height: 30px;">
                <div style="background-color: black; height: 30px;"></div>
                <div id="myEmemyHP"></div>
            </div>
        </div>
        <div id="myResults">Tie</div>
        <canvas id="myCanvas"></canvas>
    </div>
    
    <script src="fuctions.js"></script>
    <script src="classes.js"></script>
    <script src="main.js"></script>
</body>
</html>
